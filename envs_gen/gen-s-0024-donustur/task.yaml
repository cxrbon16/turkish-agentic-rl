id: gen-s-0024-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Bugün hastanede randevu sistemi yenileniyor ve veri aktarımında bazı sorunlar çıktığını gördük. Yoğun bir günün ardından, randevular.csv dosyasını düzelterek output dizini altında uygun yapıya getirmemiz gerekiyor.

  randevular.csv dosyasını CRLF'leri kaldırarak ters çevir, her satırın ilk alanını dizin adı, ikinci alanını dosya içeriği yap ve output dizini altında output/1/data, output/2/data ve output/3/data dosyalarını oluştur.

setup: |
  printf "id,patient\n1,A\r\n2,B\r\n3,C\r\n" > randevular.csv

goal_tr: >
  randevular.csv dosyasını CRLF'leri kaldırarak ters çevirip her satırın ilk
  alanını dizin adı, ikinci alanını dosya içeriği yaparak output dizini
  altında oluştur

reference_solution: |
  mkdir -p output
  tr -d '\r' < randevular.csv | rev | cut -d',' -f1,2 > tmp
  while IFS=, read -r id patient; do
    mkdir -p "output/$id"
    echo "$patient" > "output/$id/data"
  done < tmp
  rm tmp

outputs:
  - {path: output/1/data, kind: file}
  - {path: output/2/data, kind: file}
  - {path: output/3/data, kind: file}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0024
    bundle: ters-cevir
    tools:
    - rev
    - cut
    konu: hastane-randevulari
    hedef: donustur
    girdi: csv
    kaynak: tek-dosya
    cikti: dizin-yapisi
    kesif: veriye-bak
    uslup: baglam-gomulu
    direnc: crlf
    bukulme: yok
    adim: 3
    image: verifiable-dataset/base:latest
    metadata: {}
