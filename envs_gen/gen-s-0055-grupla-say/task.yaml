id: gen-s-0055-grupla-say
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  grades.tsv dosyasındaki notları gruplandırarak her notun kaç kez geçtiğini hesapla ve sonuçları alfabetik sırada not ve sayı şeklinde sonuc.txt dosyasına yaz.

setup: |
  cat > grades.tsv <<'EOF'
  Student	Grade
  Alice	A
  Bob	B
  Charlie	A
  David	C
  Eve	B
  Frank	A
  Grace	B
  Heidi	A
  Ivan	C
  Judy	B
  EOF

goal_tr: >
  grades.tsv dosyasındaki notları gruplandırarak her notun kaç kez geçtiğini
  hesapla ve sonuçları alfabetik sırada not ve sayı şeklinde sonuc.txt
  dosyasına yaz.

reference_solution: |
  tail -n +2 grades.tsv | cut -f2 | sort | uniq -c | awk '{print $2 " " $1}' > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_lines_eq, path: sonuc.txt, value: [A 4, B 4, C 2]}

metadata:
  domain: grupla-say
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0055
    bundle: sirala
    tools:
    - sort
    - uniq
    konu: ogrenci-notlari
    hedef: grupla-say
    girdi: tsv
    kaynak: tek-dosya
    cikti: satir-listesi
    kesif: yok
    uslup: kisit-sakli
    direnc: yok
    bukulme: yok
    adim: 2
    image: verifiable-dataset/base:latest
    metadata: {}
