id: gen-s-0004-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Bugün laboratuvardaki sensör verilerini incelerken, her satırın üçüncü sütununda yer alan beş haneli değerlerin toplamını merak ettim. Hava da oldukça güzel, pencereden gelen ışık ekranı aydınlatıyor. sensor_data.txt dosyasındaki her satırın üçüncü kolonundaki beş haneli sayıları ayıklayarak bunların toplamını sonuc.txt dosyasına sadece sayı olarak yaz.

setup: |
  cat > sensor_data.txt <<'EOF'
  12345 45678 78901
  23456 56789 89012
  34567 67890 90123
  45678 78901 01234
  56789 89012 12345
  EOF

goal_tr: >
  sensor_data.txt dosyasindaki her satirin 3. kolonundaki 5 haneli sayilari
  ayiklayip bunlarin toplamini sonuc.txt'ye sadece sayi olarak yaz

reference_solution: |
  tr -s ' ' '\n' < sensor_data.txt | sed -n '3~3p' | tr -d '\n' | sed 's/./&\n/g' | awk '{s+=$1} END {print s}' > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: '85'}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0004
    bundle: metin-duzenle
    tools:
    - sed
    - tr
    konu: sensor-olcumleri
    hedef: ayikla
    girdi: sabit-genislik
    kaynak: tek-dosya
    cikti: tek-sayi
    kesif: yok
    uslup: baglam-gomulu
    direnc: yok
    bukulme: yok
    adim: 4
    image: verifiable-dataset/base:latest
    metadata: {}
