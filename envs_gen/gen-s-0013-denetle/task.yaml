id: gen-s-0013-denetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  hastane dizinindeki doktorlar.ini ve randevular.ini dosyalarından her doktora ait randevu sayısını ve kapasitesini denetleyip sonuc.csv dosyasına doktor adı, randevu sayısı ve kapasite sütunları halinde, her satırda bir doktor olacak şekilde yaz ve satir_sayisi.txt dosyasına sonuc.csv'deki satır sayısını sadece sayı olsun biçiminde kaydet.

setup: |
  mkdir -p hastane
  cat > hastane/doktorlar.ini <<'EOF'
  [doktor1]
  isim = Ahmet Yilmaz
  bolum = Dahiliye
  gunluk_randevu = 10

  [doktor2]
  isim = Ayse Demir
  bolum = Pediatri
  gunluk_randevu = 15

  [doktor3]
  isim = Mehmet Kaya
  bolum = Kardiyoloji
  gunluk_randevu = 8
  EOF

  cat > hastane/randevular.ini <<'EOF'
  [randevu1]
  doktor = Ahmet Yilmaz
  tarih = 2023-10-01
  saat = 09:00

  [randevu2]
  doktor = Ahmet Yilmaz
  tarih = 2023-10-01
  saat = 10:00

  [randevu3]
  doktor = Ayse Demir
  tarih = 2023-10-01
  saat = 11:00

  [randevu4]
  doktor = Mehmet Kaya
  tarih = 2023-10-01
  saat = 14:00
  EOF

goal_tr: >
  doktorlar.ini ve randevular.ini dosyalarindan her doktorun randevu
  sayisini ve kapasitesini denetleyip sonuc.csv'ye yaz

reference_solution: |
  find hastane -name "randevular.ini" -exec grep -h "^doktor" {} \; | sort | uniq -c | awk '{print $2","$1}' > temp1.csv
  find hastane -name "doktorlar.ini" -exec grep -h "^gunluk_randevu" {} \; | awk -F' = ' '{print $2}' | paste -d, temp1.csv - > sonuc.csv
  wc -l < sonuc.csv | awk '{print $1}' > satir_sayisi.txt
  rm temp1.csv

outputs:
  - {path: sonuc.csv, kind: csv}
  - {path: satir_sayisi.txt, kind: file}

checks:
  - {op: file_content_eq, path: satir_sayisi.txt, value: '3'}
  - {op: file_content_eq, path: sonuc.csv, value: 'doktor,2,10

    doktor,1,15

    doktor,1,8'}

metadata:
  domain: denetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0013
    bundle: dizin-istatistik
    tools:
    - wc
    - find
    konu: hastane-randevulari
    hedef: denetle
    girdi: ini
    kaynak: iki-dosya-capraz
    cikti: csv
    kesif: yok
    uslup: kisit-sakli
    direnc: yok
    bukulme: yok
    adim: 3
    image: verifiable-dataset/base:latest
    metadata: {}
