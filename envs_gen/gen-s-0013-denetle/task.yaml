id: gen-s-0013-denetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) orders.csv dosyasındaki siparişleri analiz ederek en az iki kez sipariş edilen ürünleri ve bu ürünlerin toplam sipariş sayılarını hesapla.
  2) Elde edilen sonuçları toplam sipariş sayısına göre azalan sırada olacak şekilde sonuc.txt dosyasına yaz.

setup: |
  cat > orders.csv <<'EOF'
  order_id,customer,item,quantity
  1,Alice,Pizza,2
  2,Bob,Burger,1
  3,Charlie,Pizza,1
  4,Alice,Salad,1
  5,Bob,Burger,2
  6,David,Pizza,1
  7,Eve,Salad,3
  8,Alice,Pizza,1
  9,Bob,Pizza,1
  10,Charlie,Burger,2
  EOF

goal_tr: >
  orders.csv dosyasindaki siparislerden en az iki kez siparis edilen
  urunleri ve bu urunlerin toplam siparis sayilarini hesaplayip, toplam
  siparis sayisina gore azalan siralamayla sonuc.txt dosyasina yaz.

reference_solution: |
  cut -d',' -f3 orders.csv | sort | uniq -c | sort -nr | awk '$1 >= 2 {print $2 "," $1}' > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_lines_eq, path: sonuc.txt, value: ['Pizza,5', 'Burger,3', 'Salad,2']}

metadata:
  domain: denetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0013
    bundle: sirala
    tools:
    - sort
    - uniq
    konu: restoran-siparisleri
    hedef: denetle
    girdi: csv
    kaynak: tek-dosya
    cikti: satir-listesi
    kesif: yok
    uslup: numarali-emir
    direnc: yok
    bukulme: olcek
    adim: 4
    image: verifiable-dataset/base:latest
    metadata: {}
