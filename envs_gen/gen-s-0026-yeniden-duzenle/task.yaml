id: gen-s-0026-yeniden-duzenle
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  restoran/siparisler klasöründeki her dosyanın içeriklerini alfabetik olarak sıralayın ve siparisler_duzenli.tar arşivini oluşturun.

setup: |
  mkdir -p restoran/siparisler
  cat > restoran/siparisler/masa1.txt <<'EOF'
  pizza margherita
  pasta carbonara
  salata caesar
  EOF
  cat > restoran/siparisler/masa2.txt <<'EOF'
  pizza pepperoni
  salata green
  pasta bolognese
  EOF

goal_tr: >
  restoran/siparisler klasöründeki her dosyanın içeriklerini alfabetik
  olarak sıralayarak siparisler_duzenli.tar arşivini oluştur

reference_solution: |
  find restoran/siparisler -type f -name '*.txt' -exec sh -c 'for f; do sort "$f" > "$f.sorted"; done' _ {} + && tar -cf siparisler_duzenli.tar restoran/siparisler/*.sorted && rm restoran/siparisler/*.sorted

outputs:
  - {path: siparisler_duzenli.tar, kind: file}

checks:
  - {op: run_stdout_eq, cmd: tar -tf siparisler_duzenli.tar | sort, value: 'restoran/siparisler/masa1.txt.sorted

    restoran/siparisler/masa2.txt.sorted'}

metadata:
  domain: yeniden-duzenle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0026
    bundle: secerek-arsivle
    tools:
    - tar
    - find
    konu: restoran-siparisleri
    hedef: yeniden-duzenle
    girdi: duz-metin
    kaynak: iki-dosya-capraz
    cikti: birden-cok-dosya
    kesif: yok
    uslup: duz-hedef
    direnc: yok
    bukulme: yok
    adim: 1
    image: verifiable-dataset/base:latest
    metadata: {}
