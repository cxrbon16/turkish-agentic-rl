id: gen-s-0053-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  ledger.txt dosyasındaki sabit genişlikli verilerden tarih ve açıklama alanlarını ayıklayarak, her tarih için bir dizin oluşturun ve bu dizinlerin içinde açıklamaları içeren dosyalar yaratın. Bu işlem sonucunda 2023-01-01/item.txt, 2023-01-02/item.txt, 2023-01-03/item.txt, 2023-01-04/item.txt ve 2023-01-05/item.txt dosyaları oluşturulmalıdır.

setup: |
  cat > ledger.txt <<'EOF'
  2023-01-01 100.00  Groceries
  2023-01-02 50.00   Gas
  2023-01-03 15.50   Coffee
  2023-01-04 200.00  Rent
  2023-01-05 12.00   Lunch
  EOF

goal_tr: >
  ledger.txt dosyasındaki sabit genişlikli verilerden tarih ve açıklama
  alanlarını ayıklayarak, her tarih için bir dizin oluşturun ve bu
  dizinlerin içinde açıklamaları içeren dosyalar yaratın.

reference_solution: |
  cut -c1-10 ledger.txt > dates.txt
  cut -c15- ledger.txt > desc.txt
  paste dates.txt desc.txt > merged.txt
  while read -r date desc; do
    mkdir -p "$date"
    echo "$desc" > "$date/item.txt"
  done < merged.txt

outputs:
  - {path: 2023-01-01/item.txt, kind: file}
  - {path: 2023-01-02/item.txt, kind: file}
  - {path: 2023-01-03/item.txt, kind: file}
  - {path: 2023-01-04/item.txt, kind: file}
  - {path: 2023-01-05/item.txt, kind: file}

checks:
  - {op: file_content_eq, path: 2023-01-01/item.txt, value: .00  Groceries}
  - {op: file_content_eq, path: 2023-01-02/item.txt, value: 00   Gas}
  - {op: file_content_eq, path: 2023-01-03/item.txt, value: 50   Coffee}
  - {op: file_content_eq, path: 2023-01-04/item.txt, value: .00  Rent}
  - {op: file_content_eq, path: 2023-01-05/item.txt, value: 00   Lunch}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0053
    bundle: sutun
    tools:
    - cut
    - paste
    konu: muhasebe-kalemleri
    hedef: ayikla
    girdi: sabit-genislik
    kaynak: tek-dosya
    cikti: dizin-yapisi
    kesif: yok
    uslup: duz-hedef
    direnc: baslik-yok
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    metadata: {}
