id: gen-s-0020-ayikla
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  siparisler1.csv ve siparisler2.csv dosyalarında bulunan pizza siparişlerinin toplam sayısını toplam_pizza.txt dosyasına sadece sayı olarak kaydet.

setup: |
  cat > siparisler1.csv <<'CSV'
  id,musteri,urun,fiyat
  1,Ahmet,pizza,120
  2,Mehmet,kebab,80
  3,Ayse,salata,40
  4,Fatma,corba,30
  CSV
  cat > siparisler2.csv <<'CSV'
  id,musteri,urun,fiyat
  5,Veli,pizza,130
  6,Can,kebab,90
  7,Elif,salata,45
  8,Ali,corba,35
  CSV

goal_tr: >
  siparisler1.csv ve siparisler2.csv dosyalarindaki pizza siparislerinin
  toplam sayisini toplam_pizza.txt'ye sadece sayi olarak yaz

reference_solution: |
  grep 'pizza' siparisler1.csv | wc -l > temp1 && grep 'pizza' siparisler2.csv | wc -l > temp2 && head -1 temp1 temp2 | tail -1 | tr -d ' ' > toplam_pizza.txt && rm temp1 temp2

outputs:
  - {path: toplam_pizza.txt, kind: file}

checks:
  - {op: file_content_eq, path: toplam_pizza.txt, value: '1'}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0020
    bundle: satir-araligi
    tools:
    - head
    - tail
    konu: restoran-siparisleri
    hedef: ayikla
    girdi: csv
    kaynak: iki-dosya-capraz
    cikti: tek-sayi
    kesif: yok
    uslup: kisit-sakli
    direnc: yok
    bukulme: yok
    adim: 4
    image: verifiable-dataset/base:latest
    metadata: {}
