id: gen-s-0012-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  yorumlar.csv dosyasındaki her satırı bir JSON nesnesine dönüştürerek, tüm çıktıları yorumlar.json dosyasına bir JSON dizisi olarak kaydet.

setup: |
  cat > yorumlar.csv <<'CSV'
  12345,This product is great,5
  67890,Very bad,1
  24680,Not bad,3
  13579,Excellent,5
  CSV

goal_tr: >
  yorumlar.csv dosyasındaki her satırı JSON nesnesine dönüştür ve çıktıları
  yorumlar.json'a bir JSON dizisi olarak yaz

reference_solution: |
  rev yorumlar.csv | cut -d',' -f1,2,3 | rev | sed 's/\([^,]*\),\([^,]*\),\([^,]*\)/  {\n    "id": "\1",\n    "yorum": "\2",\n    "puan": \3\n  }/' | sed '1i[' | sed '$a]' > yorumlar.json

outputs:
  - {path: yorumlar.json, kind: json}

checks:
  - {op: file_lines_eq, path: yorumlar.json, value: ['[', '{', '"id": "12345",', '"yorum": "This product is great",', '"puan": 5', '}', '{', '"id": "67890",', '"yorum": "Very bad",', '"puan": 1', '}', '{', '"id": "24680",', '"yorum": "Not bad",', '"puan": 3', '}', '{', '"id": "13579",', '"yorum": "Excellent",', '"puan": 5', '}', ']']}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0012
    bundle: ters-cevir
    tools:
    - rev
    - cut
    konu: urun-yorumlari
    hedef: donustur
    girdi: csv
    kaynak: tek-dosya
    cikti: json
    kesif: veriye-bak
    uslup: duz-hedef
    direnc: baslik-yok
    bukulme: yok
    adim: 4
    image: verifiable-dataset/base:latest
    metadata: {}
