id: gen-s-0011-ayikla
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Bugün depo envanterini güncelleme zamanı geldi, her şey tıklım tıklım dolu. Ekibin, her stok dosyasındaki ikinci sütundaki kategori bilgilerini düzenli bir şekilde ayırmak istiyor. Bunu yapmak için envanter dizinindeki her dosyadaki ikinci sütunu al ve yeni dosyalara her sütun değeriyle aynı ada sahip olarak kaydet: envanter/stok_1_kategori.txt, envanter/stok_2_kategori.txt, envanter/stok_3_kategori.txt, envanter/stok_4_kategori.txt ve envanter/stok_5_kategori.txt.

setup: |
  mkdir -p envanter
  for i in $(seq 1 5); do
    printf "%-10s %-15s %05d\n" "URUN$i" "Kategori$((i%3+1))" "$((1000 + i*10))" > "envanter/stok_$i.txt"
  done

goal_tr: >
  envanter dizinindeki her dosyadaki ikinci sütunu al ve yeni dosyalara her
  sütun değeriyle aynı ada sahip olarak kaydet

reference_solution: |
  find envanter -type f -name 'stok_*.txt' | xargs -I{} sh -c 'grep -oP "(?<=\s)\w+(?=\s)" {} | grep -v "^[0-9]" > envanter/$(basename {} .txt)_kategori.txt'

outputs:
  - {path: envanter/stok_1_kategori.txt, kind: file}
  - {path: envanter/stok_2_kategori.txt, kind: file}
  - {path: envanter/stok_3_kategori.txt, kind: file}
  - {path: envanter/stok_4_kategori.txt, kind: file}
  - {path: envanter/stok_5_kategori.txt, kind: file}

checks:
  - {op: file_content_eq, path: envanter/stok_1_kategori.txt, value: Kategori2}
  - {op: file_content_eq, path: envanter/stok_2_kategori.txt, value: Kategori3}
  - {op: file_content_eq, path: envanter/stok_3_kategori.txt, value: Kategori1}
  - {op: file_content_eq, path: envanter/stok_4_kategori.txt, value: Kategori2}
  - {op: file_content_eq, path: envanter/stok_5_kategori.txt, value: Kategori3}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0011
    bundle: cok-dosya-ara
    tools:
    - xargs
    - grep
    konu: envanter
    hedef: ayikla
    girdi: sabit-genislik
    kaynak: cok-dosya
    cikti: yeniden-adlandirilmis
    kesif: yok
    uslup: baglam-gomulu
    direnc: yok
    bukulme: yok
    adim: 1
    image: verifiable-dataset/base:latest
    metadata: {}
