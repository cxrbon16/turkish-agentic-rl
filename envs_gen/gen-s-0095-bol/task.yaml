id: gen-s-0095-bol
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) server1.log ve server2.log dosyalarında ortak olan ERROR satırlarını bul.
  2) Bu ortak satırların sayısını hesapla.
  3) Sayısı sonuc.txt dosyasına sadece sayı olarak yaz.

setup: |
  printf "ERROR: connection refused\nINFO: server started\nERROR: timeout\nINFO: backup completed\n" > server1.log
  printf "INFO: database connected\nERROR: disk full\nWARNING: low memory\nERROR: network down\n" > server2.log

goal_tr: >
  server1.log ve server2.log dosyalarinda ortak olan ERROR satir sayisini
  sonuc.txt'ye sadece sayi olarak yaz

reference_solution: |
  seq 1 2 | while read i; do grep 'ERROR' server"$i".log; done | sort | uniq -c | grep -w 2 | awk '{print $1}' > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: file}

