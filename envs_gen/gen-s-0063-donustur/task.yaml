id: gen-s-0063-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  logs dizinindeki tüm .ini dosyalarında [error] bölümündeki count değerlerini topla ve sonucu sadece sayı olarak sonuc.txt dosyasının içine yaz.

setup: |
  mkdir -p logs
  cat > logs/server1.ini <<'EOF'
  [error]
  count=42
  [warning]
  count=15
  EOF
  cat > logs/server2.ini <<'EOF'
  [error]
  count=23
  [critical]
  count=7
  EOF
  cat > logs/server3.ini <<'EOF'
  [error]
  count=10
  [warning]
  count=5
  EOF

goal_tr: >
  logs dizinindeki .ini dosyalarinda [error] bolumundeki count degerlerini
  toplayip sonuc.txt'ye sadece sayi olarak yaz

reference_solution: |
  grep -h '^count=' logs/*.ini | sort | join -t= -1 2 -2 1 <(printf "=%s=count\n" $(seq 1 100)) | cut -d= -f3 | awk '{s+=$1} END {print s}' > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: file}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0063
    bundle: birlestir
    tools:
    - join
    - sort
    konu: sunucu-loglari
    hedef: donustur
    girdi: ini
    kaynak: cok-dosya
    cikti: tek-sayi
    kesif: yok
    uslup: duz-hedef
    direnc: yok
    bukulme: yok
    adim: 2
    image: verifiable-dataset/base:latest
    metadata: {}
