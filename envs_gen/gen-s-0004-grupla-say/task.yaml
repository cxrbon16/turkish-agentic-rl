id: gen-s-0004-grupla-say
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Lojistik biriminden gelen son raporlar, gönderi süreçlerindeki gecikmelerin belirli bölgelerde yoğunlaştığını gösteriyor. Bu durumu daha iyi analiz edebilmek için, shipments.ini dosyasındaki her bir durumun (status) kaç kez tekrarlandığını belirleyip, sonuçları alfabetik olarak 'status:count' formatında sonuc.txt dosyasına yazman gerekiyor. Böylece hangi durumun daha sık yaşandığını net bir şekilde görebileceğiz.

setup: |
  cat > shipments.ini <<'EOF'
  [TRK001]
  status=delivered
  region=North
  [TRK002]
  status=in_transit
  region=South
  [TRK003]
  status=delivered
  region=North
  [TRK004]
  status=pending
  region=East
  [TRK005]
  status=delivered
  region=West
  [TRK006]
  status=in_transit
  region=South
  [TRK007]
  status=delivered
  region=North
  EOF

goal_tr: >
  shipments.ini dosyasindeki her bir durumun (status) kac kez
  tekrarlandigini belirle ve sonuclari 'status:count' formatinda alfabetik
  olarak sonuc.txt dosyasina yaz.

reference_solution: |
  find . -name "shipments.ini" | xargs grep "status=" | cut -d'=' -f2 | sort | uniq -c | awk '{print $2":"$1}' | sort > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_lines_eq, path: sonuc.txt, value: ['delivered:4', 'in_transit:2', 'pending:1']}

metadata:
  domain: grupla-say
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0004
    bundle: sirala
    tools:
    - sort
    - uniq
    konu: kargo-takibi
    hedef: grupla-say
    girdi: ini
    kaynak: tek-dosya
    cikti: satir-listesi
    kesif: dosyayi-bul
    uslup: baglam-gomulu
    direnc: yok
    bukulme: yok
    adim: 4
    image: verifiable-dataset/base:latest
    metadata: {}
