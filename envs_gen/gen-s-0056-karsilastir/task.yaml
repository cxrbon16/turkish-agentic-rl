id: gen-s-0056-karsilastir
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  patients_a.txt ve patients_b.txt dosyalarındaki ortak hasta isimlerini belirleyip data/sorted/common.txt dosyasına yazın.

  Şu şartlar sağlanmalı:
  - data/sorted/common.txt dosyası oluşturulmalı ve içinde her iki dosyada da bulunan isimler yer almalı.
  - Çıktı sadece her iki dosyada da ortak olan isimleri içermeli.

setup: |
  cat > patients_a.txt <<'EOF'
  Alice
  Bob
  Charlie
  David
  Eve
  EOF

  cat > patients_b.txt <<'EOF'
  Bob
  Eve
  Frank
  Grace
  Heidi
  EOF

  mkdir -p data/sorted

goal_tr: >
  patients_a.txt ve patients_b.txt dosyalarındaki ortak hasta isimlerini
  belirleyip data/sorted/common.txt dosyasına yaz.

reference_solution: |
  sort patients_a.txt > data/sorted/a_sorted.txt
  sort patients_b.txt > data/sorted/b_sorted.txt
  comm -12 data/sorted/a_sorted.txt data/sorted/b_sorted.txt > data/sorted/common.txt
  rm data/sorted/a_sorted.txt data/sorted/b_sorted.txt

outputs:
  - {path: data/sorted/common.txt, kind: file}

checks:
  - {op: file_lines_eq, path: data/sorted/common.txt, value: [Bob, Eve]}

metadata:
  domain: karsilastir
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0056
    bundle: kume-farki
    tools:
    - comm
    - sort
    konu: hastane-randevulari
    hedef: karsilastir
    girdi: duz-metin
    kaynak: iki-dosya-capraz
    cikti: dizin-yapisi
    kesif: dosyayi-bul
    uslup: kabul-kriteri
    direnc: yok
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    metadata: {}
