id: gen-s-0005-onar
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  hastane dizinindeki tüm dosyalarda bozuk formatlı satırları düzelterek geçersiz karakterleri kaldır ve toplam randevu sayısını sadece sayı olsun şeklinde sayi.txt dosyasına yaz.

setup: |
  mkdir -p hastane/randevular
  printf "2023-01-01|Dr.Ahmet|10:00\n2023-01-01|Dr.Mehmet|11:00\n" > hastane/randevular/kayit1.txt
  printf "2023-01-02|Dr.Ayse|09:00\n2023-01-02|Dr.Fatma|14:00\n" > hastane/randevular/kayit2.txt
  sed -i 's/|/ /g' hastane/randevular/kayit1.txt
  tr ':' ' ' < hastane/randevular/kayit2.txt > hastane/randevular/kayit2_temp.txt
  mv hastane/randevular/kayit2_temp.txt hastane/randevular/kayit2.txt

goal_tr: >
  hastane dizinindeki tüm dosyalarda bozuk formatlı satırları düzelterek
  geçersiz karakterleri kaldır ve toplam randevu sayısını sayi.txt'ye yaz

reference_solution: |
  find hastane -type f -exec sed -i 's/[^a-zA-Z0-9 -]//g' {} +
  find hastane -type f -exec cat {} + | tr -s ' ' '\n' | grep -c . > sayi.txt

outputs:
  - {path: sayi.txt, kind: file}

checks:
  - {op: file_content_eq, path: sayi.txt, value: '10'}

metadata:
  domain: onar
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0005
    bundle: metin-duzenle
    tools:
    - sed
    - tr
    konu: hastane-randevulari
    hedef: onar
    girdi: log-satiri
    kaynak: dizin-agaci
    cikti: tek-sayi
    kesif: yok
    uslup: kisit-sakli
    direnc: yok
    bukulme: kirli-veri
    adim: 2
    image: verifiable-dataset/base:latest
    metadata: {}
