id: gen-s-0028-yeniden-duzenle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  shifts/day ve shifts/night dizinlerindeki tüm .txt dosyalarını, isimlerini koruyarak archive/day ve archive/night dizinlerine taşıyın.

  Şu şartlar sağlanmalı:
  - shifts/day dizinindeki tüm .txt dosyaları archive/day dizinine taşınmış olmalı.
  - shifts/night dizinindeki tüm .txt dosyaları archive/night dizinine taşınmış olmalı.
  - Taşınan dosyaların isimleri orijinal halleriyle korunmuş olmalı.

setup: |
  mkdir -p shifts/day shifts/night
  cat > shifts/day/shift1.txt <<'EOF'
  Employee: Alice
  Hours: 08:00-16:00
  EOF
  cat > shifts/day/shift2.txt <<'EOF'
  Employee: Bob
  Hours: 08:00-16:00
  EOF
  cat > shifts/night/shift3.txt <<'EOF'
  Employee: Charlie
  Hours: 22:00-06:00
  EOF
  cat > shifts/night/shift4.txt <<'EOF'
  Employee: David
  Hours: 22:00-06:00
  EOF
  mkdir -p archive/day archive/night

goal_tr: >
  shifts/day ve shifts/night dizinlerindeki tum .txt dosyalarini, isimlerini
  koruyarak archive/day ve archive/night dizinlerine tasiyin.

reference_solution: |
  find shifts/day -name "*.txt" -exec mv {} archive/day/ \;
  find shifts/night -name "*.txt" -exec mv {} archive/night/ \;
  mkdir -p archive/processed
  mv archive/day archive/processed/day
  mv archive/night archive/processed/night

outputs:
  - {path: archive/processed/day, kind: dir}
  - {path: archive/processed/night, kind: dir}

checks:
  - {op: dir_entries_eq, path: archive/processed/day, value: [shift1.txt, shift2.txt]}
  - {op: dir_entries_eq, path: archive/processed/night, value: [shift3.txt, shift4.txt]}
  - {op: not_exists, path: archive/day}
  - {op: not_exists, path: archive/night}
  - {op: not_exists, path: shifts/day/shift1.txt}
  - {op: not_exists, path: shifts/day/shift2.txt}
  - {op: not_exists, path: shifts/night/shift3.txt}
  - {op: not_exists, path: shifts/night/shift4.txt}

metadata:
  domain: yeniden-duzenle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0028
    bundle: dosya-duzen
    tools:
    - mkdir
    - mv
    konu: personel-vardiyalari
    hedef: yeniden-duzenle
    girdi: duz-metin
    kaynak: cok-dosya
    cikti: yeniden-adlandirilmis
    kesif: dosyayi-bul
    uslup: kabul-kriteri
    direnc: yok
    bukulme: yok
    adim: 3
    image: verifiable-dataset/base:latest
    metadata: {}
