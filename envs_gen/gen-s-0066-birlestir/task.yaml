id: gen-s-0066-birlestir
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  employees.json ve shifts.json dosyalarındaki verileri id ve emp_id alanları üzerinden eşleştirerek, her çalışanın adını ve vardiya bilgisini içeren result.txt dosyasını oluşturun.

  Şu şartlar sağlanmalı:
  - Her satırda yalnızca bir çalışan için isim ve vardiya bilgisi yer almalıdır.
  - employees.json ve shifts.json dosyalarındaki tüm eşleşen kayıtlar doğru şekilde işlenmelidir.
  - Çıktı dosyası result.txt adıyla oluşturulmalıdır.

setup: |
  cat > employees.json <<'EOF'
  [
    {"id": "101", "name": "Alice"},
    {"id": "102", "name": "Bob"},
    {"id": "103", "name": "Charlie"},
    {"id": "104", "name": "David"}
  ]
  EOF

  cat > shifts.json <<'EOF'
  [
    {"emp_id": "101", "shift": "Morning"},
    {"emp_id": "103", "shift": "Evening"},
    {"emp_id": "102", "shift": "Night"},
    {"emp_id": "104", "shift": "Morning"}
  ]
  EOF

goal_tr: >
  employees.json ve shifts.json dosyalarındaki verileri id/emp_id üzerinden
  eşleştirerek her çalışan için isim ve vardiya bilgilerini içeren bir dosya
  oluşturun.

reference_solution: |
  grep -oP '(?<="id": ")[^"]+|(?<="name": ")[^"]+' employees.json | sed 'N;s/\n/ /' | sort > emp_sorted.txt
  grep -oP '(?<="emp_id": ")[^"]+|(?<="shift": ")[^"]+' shifts.json | sed 'N;s/\n/ /' | sort > shift_sorted.txt
  join -1 1 -2 1 emp_sorted.txt shift_sorted.txt > result.txt

outputs:
  - {path: result.txt, kind: file}

checks:
  - {op: file_lines_eq, path: result.txt, value: [101 Alice Morning, 102 Bob Night, 103 Charlie Evening, 104 David Morning]}

metadata:
  domain: birlestir
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0066
    bundle: birlestir
    tools:
    - join
    - sort
    konu: personel-vardiyalari
    hedef: birlestir
    girdi: json
    kaynak: iki-dosya-capraz
    cikti: birden-cok-dosya
    kesif: yok
    uslup: kabul-kriteri
    direnc: yok
    bukulme: yok
    adim: 1
    image: verifiable-dataset/base:latest
    metadata: {}
