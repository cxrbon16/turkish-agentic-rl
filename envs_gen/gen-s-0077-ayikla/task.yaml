id: gen-s-0077-ayikla
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  entries_*.ini dosyalarının her birinden ilk ve son satırı ayıklayarak entries.csv dosyasına yazın.

setup: |
  cat > entries_a.ini <<'EOF'
  [2023-01-01]
  amount=100.50
  category=office
  [2023-01-02]
  amount=200.00
  category=travel
  EOF

  cat > entries_b.ini <<'EOF'
  [2023-01-03]
  amount=50.25
  category=supplies
  [2023-01-04]
  amount=120.00
  category=meals
  EOF

  cat > entries_c.ini <<'EOF'
  [2023-01-05]
  amount=300.00
  category=rent
  EOF

goal_tr: >
  entries_*.ini dosyalarinin her birinden ilk ve son satiri ayiklayarak
  entries.csv dosyasina yaz

reference_solution: |
  head -q -n 1 entries_*.ini > entries.csv
  tail -q -n 1 entries_*.ini >> entries.csv

outputs:
  - {path: entries.csv, kind: file}

checks:
  - {op: file_lines_eq, path: entries.csv, value: ['[2023-01-01]', '[2023-01-03]', '[2023-01-05]', category=travel, category=meals, category=rent]}

metadata:
  domain: ayikla
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0077
    bundle: satir-araligi
    tools:
    - head
    - tail
    konu: muhasebe-kalemleri
    hedef: ayikla
    girdi: ini
    kaynak: cok-dosya
    cikti: csv
    kesif: yok
    uslup: duz-hedef
    direnc: son-newline-yok
    bukulme: yok
    adim: 1
    image: verifiable-dataset/base:latest
    metadata: {}
