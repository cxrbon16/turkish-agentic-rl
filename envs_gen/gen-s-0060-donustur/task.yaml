id: gen-s-0060-donustur
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 14

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  weather_data dizinindeki her bir sabit genişlikli dosyanın son sütununu ters çevirin ve ilk 5 karakterini alarak aynı isimli dosyaları processed_weather/station1.txt, processed_weather/station2.txt ve processed_weather/station3.txt olarak kaydedin.

setup: |
  mkdir -p weather_data
  cat > weather_data/station1.txt <<'EOF'
  2023-01-01 12:00  22.5  45%  Sunny
  2023-01-01 13:00  23.0  44%  Sunny
  2023-01-01 14:00  23.5  43%  Sunny
  2023-01-01 15:00  22.8  46%  Cloudy
  EOF
  cat > weather_data/station2.txt <<'EOF'
  2023-01-01 12:00  18.2  60%  Rainy
  2023-01-01 13:00  18.5  58%  Rainy
  2023-01-01 14:00  17.9  62%  Rainy
  2023-01-01 15:00  17.5  65%  Cloudy
  EOF
  cat > weather_data/station3.txt <<'EOF'
  2023-01-01 12:00  10.1  80%  Snowy
  2023-01-01 13:00  10.5  78%  Snowy
  2023-01-01 14:00  10.3  79%  Snowy
  2023-01-01 15:00  9.8   82%  Snowy
  EOF

goal_tr: >
  weather_data dizinindeki her bir sabit genişlikli dosyanın son sütununu
  ters çevirip ilk 5 karakterini alarak aynı isimli dosyaları
  processed_weather dizinine kaydedin.

reference_solution: |
  mkdir -p processed_weather
  for f in weather_data/*.txt; do
      rev "$f" | cut -c 1-5 | rev > "processed_weather/$(basename "$f")"
  done
  mv processed_weather/*.txt processed_weather/$(basename $(ls weather_data/*.txt | head -n 1)).txt
  # Note: The seed requires multiple output files, but the twist is scale. 
  # The reference solution must process each input file.
  mkdir -p processed_weather
  for f in weather_data/*.txt; do
      filename=$(basename "$f")
      rev "$f" | cut -c 1-5 | rev > "processed_weather/$filename"
  done

outputs:
  - {path: processed_weather/station1.txt, kind: file}
  - {path: processed_weather/station2.txt, kind: file}
  - {path: processed_weather/station3.txt, kind: file}

checks:
  - {op: file_lines_eq, path: processed_weather/station1.txt, value: [Sunny, Sunny, Sunny, loudy]}
  - {op: file_lines_eq, path: processed_weather/station2.txt, value: [Rainy, Rainy, Rainy, loudy]}
  - {op: file_lines_eq, path: processed_weather/station3.txt, value: [Snowy, Snowy, Snowy, Snowy]}

metadata:
  domain: donustur
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0060
    bundle: ters-cevir
    tools:
    - rev
    - cut
    konu: hava-durumu-kayitlari
    hedef: donustur
    girdi: sabit-genislik
    kaynak: cok-dosya
    cikti: birden-cok-dosya
    kesif: yok
    uslup: duz-hedef
    direnc: tekrar-eden-kayit
    bukulme: olcek
    adim: 4
    image: verifiable-dataset/base:latest
    metadata: {}
