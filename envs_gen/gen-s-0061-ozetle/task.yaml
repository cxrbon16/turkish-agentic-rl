id: gen-s-0061-ozetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 16

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  logs klasöründeki her dosyanın ilk 3 ve son 2 satırını birleştirip ERR ile başlayan satır sayısını sonuc.txt dosyasına sadece sayı olarak yaz.

  Şu koşullar sağlanmalı:
  - sonuc.txt dosyası oluşturulmalı.
  - sonuc.txt içindeki değer sadece sayı olmalı.
  - Hesaplama logs klasöründeki tüm dosyaları kapsamalı.

setup: |
  mkdir -p logs
  for i in $(seq 1 5); do
    printf "ERR%03d: Server %d failed\n" $i $i > logs/server_$i.log
    printf "INFO: Server %d started\n" $i >> logs/server_$i.log
    printf "ERR%03d: Retry attempt %d\n" $((i+5)) $i >> logs/server_$i.log
    printf "WARN: Server %d slow response\n" $i >> logs/server_$i.log
    printf "ERR%03d: Timeout on server %d\n" $((i+10)) $i >> logs/server_$i.log
  done

goal_tr: >
  logs klasöründeki her dosyanın ilk 3 ve son 2 satırını birleştirip ERR ile
  başlayan satır sayısını sonuc.txt'ye sadece sayı olarak yaz

reference_solution: |
  (
    for f in logs/*.log; do
      head -n 3 "$f"
      tail -n 2 "$f"
    done
  ) | grep '^ERR' | wc -l > sonuc.txt

outputs:
  - {path: sonuc.txt, kind: file}

checks:
  - {op: file_content_eq, path: sonuc.txt, value: '15'}

metadata:
  domain: ozetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0061
    bundle: satir-araligi
    tools:
    - head
    - tail
    konu: sunucu-loglari
    hedef: ozetle
    girdi: sabit-genislik
    kaynak: cok-dosya
    cikti: tek-sayi
    kesif: dolayli-hedef
    uslup: kabul-kriteri
    direnc: yok
    bukulme: yok
    adim: 5
    image: verifiable-dataset/base:latest
    metadata: {}
