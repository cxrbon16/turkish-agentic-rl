id: gen-s-0075-denetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 10

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  Her personel adını içeren tüm dosyaların içeriğini denetim dizini altında o personel adına ait tek bir dosyada birleştir. denetim/ali.txt ve denetim/veli.txt dosyaları her satırda bir kayıt olacak şekilde oluşmalıdır.

setup: |
  mkdir -p personel/vardiya1 personel/vardiya2 personel/vardiya3
  cat > personel/vardiya1/ali.txt <<'EOF'
  Ali    08:00-16:00  Pazartesi
  Ali    08:00-16:00  Sali
  EOF
  cat > personel/vardiya1/veli.txt <<'EOF'
  Veli    16:00-00:00  Carsamba
  Veli    16:00-00:00  Persembe
  EOF
  cat > personel/vardiya2/ali.txt <<'EOF'
  Ali    00:00-08:00  Cuma
  Ali    00:00-08:00  Cumartesi
  EOF
  cat > personel/vardiya2/veli.txt <<'EOF'
  Veli    08:00-16:00  Pazar
  Veli    08:00-16:00  Pazartesi
  EOF
  cat > personel/vardiya3/ali.txt <<'EOF'
  Ali    16:00-00:00  Sali
  Ali    16:00-00:00  Carsamba
  EOF
  cat > personel/vardiya3/veli.txt <<'EOF'
  Veli    00:00-08:00  Persembe
  Veli    00:00-08:00  Cuma
  EOF

goal_tr: >
  Her personel adını içeren tüm dosyaların içeriğini o personel adına ait
  tek bir dosyada birleştir

reference_solution: |
  mkdir -p denetim && find personel -type f -name '*.txt' | awk -F'/' '{print $0, $3}' | sort -k2,2 | awk -F'[ /]' '{print $0 > ("denetim/" $3 ".txt")}'

outputs:
  - {path: denetim/ali.txt, kind: file}
  - {path: denetim/veli.txt, kind: file}

metadata:
  domain: denetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0075
    bundle: awk
    tools:
    - awk
    konu: personel-vardiyalari
    hedef: denetle
    girdi: sabit-genislik
    kaynak: dizin-agaci
    cikti: dizin-yapisi
    kesif: dosyayi-bul
    uslup: kisit-sakli
    direnc: yok
    bukulme: kirli-veri
    adim: 2
    image: verifiable-dataset/base:latest
    metadata: {}
