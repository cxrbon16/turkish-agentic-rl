id: gen-s-0088-arsivle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  library dizinindeki tüm .csv dosyalarını bulup bunları library_archive.tar adında bir arşiv dosyasında toplayın.

  Şu şartlar sağlanmalı:
  - Arşiv dosyası tam olarak library_archive.tar adında olmalıdır.
  - Arşivde yalnızca library dizini ve alt dizinlerinde bulunan .csv dosyaları yer almalıdır.
  - Diğer dosya türleri (örneğin .txt dosyaları) arşive dahil edilmemelidir.

setup: |
  mkdir -p library/fiction
  mkdir -p library/nonfiction
  mkdir -p library/reference
  cat > library/fiction/books.csv <<'CSV'
  id,title,author
  1,The Hobbit,Tolkien
  2,1984,Orwell
  CSV
  cat > library/nonfiction/history.csv <<'CSV'
  id,title,author
  3,Sapiens,Harari
  4,Guns Germs and Steel,Diamond
  CSV
  cat > library/reference/dictionary.csv <<'CSV'
  id,word,definition
  5,apple,fruit
  6,banana,fruit
  CSV
  touch library/fiction/notes.txt
  touch library/nonfiction/notes.txt

goal_tr: >
  library dizinindeki tüm .csv dosyalarını bulup arşivle ve arşiv dosyasının
  adını library_archive.tar olarak belirle

reference_solution: |
  find library -name "*.csv" | xargs tar -cf library_archive.tar

outputs:
  - {path: library_archive.tar, kind: file}

checks:
  - {op: run_stdout_eq, cmd: tar -tf library_archive.tar | sort, value: 'library/fiction/books.csv

    library/nonfiction/history.csv

    library/reference/dictionary.csv'}

metadata:
  domain: arsivle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0088
    bundle: secerek-arsivle
    tools:
    - tar
    - find
    konu: kutuphane-kayitlari
    hedef: arsivle
    girdi: csv
    kaynak: dizin-agaci
    cikti: yeniden-adlandirilmis
    kesif: dosyayi-bul
    uslup: kabul-kriteri
    direnc: yok
    bukulme: yok
    adim: 3
    image: verifiable-dataset/base:latest
    metadata: {}
