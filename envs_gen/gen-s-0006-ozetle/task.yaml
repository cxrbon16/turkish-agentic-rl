id: gen-s-0006-ozetle
split: multi_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 12

# Bu task uretildi ve heniz tamamlanmadi: prompt creative writing
# asamasinda, alt_solutions ise rakip cozum asamasinda eklenecek.
prompt: |
  1) weather.json dosyasındaki her şehir için city dizini altında o şehrin adıyla bir dizin oluştur.
  2) Her şehir dizini altında, o şehre ait tüm kayıtları data.txt dosyasında topla.

setup: |
  mkdir -p /workspace/data
  cat > /workspace/data/weather.json <<'EOF'
  {"city":"Istanbul","date":"2023-01-01","temp":10,"humidity":80}
  {"city":"Istanbul","date":"2023-01-02","temp":12,"humidity":75}
  {"city":"Ankara","date":"2023-01-01","temp":5,"humidity":60}
  {"city":"Ankara","date":"2023-01-02","temp":7,"humidity":55}
  {"city":"Izmir","date":"2023-01-01","temp":15,"humidity":70}
  {"city":"Izmir","date":"2023-01-02","temp":14,"humidity":72}
  EOF

goal_tr: >
  weather.json dosyasindaki her sehir icin o sehir adinda bir dizin olustur
  ve icinde o sehre ait tum kayitlari tek dosyada topla

reference_solution: |
  mkdir -p city
  awk -F'[,:}]' '{
    city=""; date=""; temp=""; humidity=""
    for(i=1;i<=NF;i++) {
      gsub(/"/, "", $i)
      if($i == "city") city = $(i+1)
      if($i == "date") date = $(i+1)
      if($i == "temp") temp = $(i+1)
      if($i == "humidity") humidity = $(i+1)
    }
    system("mkdir -p city/" city)
    print city "," date "," temp "," humidity > ("city/" city "/data.txt")
  }' /workspace/data/weather.json

outputs:
  - {path: city/Istanbul/data.txt, kind: file}
  - {path: city/Ankara/data.txt, kind: file}
  - {path: city/Izmir/data.txt, kind: file}

metadata:
  domain: ozetle
  language: tr
  generated: true
  pipeline: spec-1
  seed:
    id: s-0006
    bundle: awk
    tools:
    - awk
    konu: hava-durumu-kayitlari
    hedef: ozetle
    girdi: json
    kaynak: tek-dosya
    cikti: dizin-yapisi
    kesif: dolayli-hedef
    uslup: numarali-emir
    direnc: yok
    bukulme: yok
    adim: 3
    image: verifiable-dataset/base:latest
    metadata: {}
