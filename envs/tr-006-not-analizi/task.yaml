prompt: |
  Bir Linux terminalindesin, çalışma dizinin /workspace.

  Bu dizindeki "notlar.csv" dosyası bir sınıfın sınav sonuçlarını tutuyor.
  Dosyanın ilk satırı başlık ("isim,not"), sonraki 100 satırın her biri bir
  öğrencinin adını ve aldığı notu içeriyor.

  Bu veriyi analiz et ve sonuçları "analiz.json" adında bir JSON dosyasına
  yaz. Dosya tam olarak şu alanları içermeli:

  ortalama          -> notların aritmetik ortalaması, 2 ondalık basamağa yuvarlanmış
  medyan            -> notların medyanı, 2 ondalık basamağa yuvarlanmış
    aykiri_indeksler  -> aykırı değere sahip satırların numaraları (liste)
    en_yuksek_isim    -> en yüksek notu alan öğrencinin adı
    en_dusuk_isim     -> en düşük notu alan öğrencinin adı
    kirkbes_alti      -> notu 45'in altında olan öğrencilerin adları (liste)

  Aykırı değer tanımı: Q1 birinci çeyrek, Q3 üçüncü çeyrek ve IQR = Q3 - Q1
  olmak üzere, (Q1 - 1.5 * IQR) değerinden küçük veya (Q3 + 1.5 * IQR)
  değerinden büyük olan notlar aykırıdır.

  Satır numarası: başlık satırı sayılmaz, veri satırları 1'den başlar. Yani
  dosyanın 2. satırındaki öğrenci 1 numaralı satırdır.

  İşin bittiğinde kısaca ne yaptığını özetle.

# Susuz, kesin amac ifadesi. Prompt'un ham hali: creative writing asamasi
# bunu Turkce anlatiya cevirir, rakip cozum ise YALNIZCA bunu gorup gorevi
# sifirdan cozer -- iki bagimsiz uygulama ayni cevaba varmiyorsa amac
# yeterince kesin degil demektir.
goal_tr: >
  notlar.csv'deki 100 ogrencinin notlarindan ortalama, medyan, IQR kuralina
  gore aykiri satir numaralari, en yuksek ve en dusuk notu alan ogrencilerin
  adlari ve notu 45'in altinda olanlarin adlarini hesaplayip analiz.json'a
  yaz

reference_solution: |
  cat > analiz.py <<'PY'
  import csv, json, statistics

  with open("notlar.csv", newline="") as f:
      rows = list(csv.DictReader(f))
  isimler = [r["isim"] for r in rows]
  notlar = [int(r["not"]) for r in rows]

  q1, _, q3 = statistics.quantiles(notlar, n=4, method="inclusive")
  iqr = q3 - q1
  alt, ust = q1 - 1.5 * iqr, q3 + 1.5 * iqr

  sonuc = {
    "ortalama": round(sum(notlar) / len(notlar), 2),
    "medyan": round(statistics.median(notlar), 2),
    "aykiri_indeksler": [i + 1 for i, v in enumerate(notlar) if v < alt or v > ust],
    "en_yuksek_isim": isimler[notlar.index(max(notlar))],
    "en_dusuk_isim": isimler[notlar.index(min(notlar))],
    "kirkbes_alti": [isimler[i] for i, v in enumerate(notlar) if v < 45],
  }
  with open("analiz.json", "w") as f:
    json.dump(sonuc, f, ensure_ascii=False, indent=2)
  PY
  python3 analiz.py

# Referanstan farkli ama ayni derecede dogru cozumler. Turetilen check'ler
# bunlarin hepsinde de gecmeli: gecmiyorsa check'ler bicime takiliyor,
# yani gereginden siki demektir.
alt_solutions:
  - name: "ara betik yok: inline python3, ters anahtar sirasi, elle ceyreklik"
    script: |
      python3 - <<'PY'
      import csv, json, statistics
      rows = list(csv.DictReader(open("notlar.csv", newline="")))
      isim = [r["isim"] for r in rows]
      puan = [int(r["not"]) for r in rows]

      s = sorted(puan)
      n = len(s)

      def q(p):
          h = (n - 1) * p
          lo = int(h)
          hi = min(lo + 1, n - 1)
          return s[lo] + (h - lo) * (s[hi] - s[lo])

      q1, q3 = q(0.25), q(0.75)
      iqr = q3 - q1
      dip, tavan = q1 - 1.5 * iqr, q3 + 1.5 * iqr

      out = {
          "kirkbes_alti": [isim[i] for i, v in enumerate(puan) if v < 45],
          "en_dusuk_isim": isim[puan.index(min(puan))],
          "en_yuksek_isim": isim[puan.index(max(puan))],
          "aykiri_indeksler": [i + 1 for i, v in enumerate(puan) if v < dip or v > tavan],
          "medyan": round(statistics.median(puan), 2),
          "ortalama": round(sum(puan) / len(puan), 2),
      }
      open("analiz.json", "w").write(json.dumps(out, indent=4, sort_keys=True))
      PY

