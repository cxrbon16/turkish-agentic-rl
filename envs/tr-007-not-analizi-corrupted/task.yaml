prompt: |
  Bir Linux terminalindesin, çalışma dizinin /workspace.

  Bu dizindeki "notlar.csv" dosyası bir sınıfın sınav sonuçlarını tutuyor.
  Dosyanın ilk satırı başlık ("isim,not"), sonraki 100 satırın her biri bir
  öğrencinin adını ve aldığı notu içeriyor.

  DİKKAT: Veri temiz değil. Bazı satırlarda not alanı boş veya sayı değil.
  Bu satırları analizin dışında bırak, ama kaç tane olduklarını say.

  Bu veriyi analiz et ve sonuçları "analiz.json" adında bir JSON dosyasına
  yaz. Dosya tam olarak şu alanları içermeli:

    ortalama             -> geçerli notların aritmetik ortalaması, 2 ondalık basamağa yuvarlanmış
    medyan               -> geçerli notların medyanı, 2 ondalık basamağa yuvarlanmış
    aykiri_indeksler     -> aykırı değere sahip satırların numaraları (liste)
    en_yuksek_isim       -> en yüksek notu alan öğrencinin adı
    en_dusuk_isim        -> en düşük notu alan öğrencinin adı
    kirkbes_alti         -> notu 45'in altında olan öğrencilerin adları (liste)
    hatali_satir_sayisi  -> notu boş veya sayı olmayan satırların sayısı

  Aykırı değer tanımı: Q1 birinci çeyrek, Q3 üçüncü çeyrek ve IQR = Q3 - Q1
  olmak üzere, (Q1 - 1.5 * IQR) değerinden küçük veya (Q3 + 1.5 * IQR)
  değerinden büyük olan notlar aykırıdır. Aykırı değer hesabına yalnızca
  geçerli notlar girer.

  Satır numarası: başlık satırı sayılmaz, veri satırları 1'den başlar. Hatalı
  satırlar da numara alır, yani numaralar dosyadaki konuma göredir. Örneğin
  dosyanın 2. satırındaki öğrenci 1 numaralı satırdır.

  İşin bittiğinde kısaca ne yaptığını özetle.

reference_solution: |
  cat > analiz.py <<'PY'
  import csv, json, statistics

  with open("notlar.csv", newline="") as f:
      rows = list(csv.DictReader(f))

  gecerli = []
  hatali = 0
  for no, r in enumerate(rows, start=1):
      ham = (r["not"] or "").strip()
      if ham.lstrip("-").isdigit():
          gecerli.append((no, r["isim"], int(ham)))
      else:
          hatali += 1

  puanlar = [p for _, _, p in gecerli]
  q1, _, q3 = statistics.quantiles(puanlar, n=4, method="inclusive")
  iqr = q3 - q1
  alt, ust = q1 - 1.5 * iqr, q3 + 1.5 * iqr

  sonuc = {
      "ortalama": round(sum(puanlar) / len(puanlar), 2),
      "medyan": round(statistics.median(puanlar), 2),
      "aykiri_indeksler": [no for no, _, p in gecerli if p < alt or p > ust],
      "en_yuksek_isim": max(gecerli, key=lambda t: t[2])[1],
      "en_dusuk_isim": min(gecerli, key=lambda t: t[2])[1],
      "kirkbes_alti": [ad for _, ad, p in gecerli if p < 45],
      "hatali_satir_sayisi": hatali,
  }
  with open("analiz.json", "w") as f:
      json.dump(sonuc, f, ensure_ascii=False, indent=2)
  PY
  python3 analiz.py

checks:
