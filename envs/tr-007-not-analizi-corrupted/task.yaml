  - {op: json_field_eq, path: analiz.json, field: ortalama, value: 60.15, tol: 0.01}
  - {op: json_field_eq, path: analiz.json, field: medyan, value: 60.0, tol: 0.01}
  - {op: json_field_eq, path: analiz.json, field: aykiri_indeksler, value: [7, 49, 72, 89], as_set: true}
  - {op: json_field_eq, path: analiz.json, field: en_yuksek_isim, value: "Osman Celik"}
  - {op: json_field_eq, path: analiz.json, field: en_dusuk_isim, value: "Ayse Kaya"}
  - {op: json_field_eq, path: analiz.json, field: kirkbes_alti, value: ["Ayse Kaya", "Baris Cetin", "Buse Cetin", "Ceren Aydin", "Ceren Yildiz", "Hasan Aslan", "Melis Sahin", "Meryem Kilic", "Onur Ozturk", "Serkan Arslan", "Sevim Ozturk"], as_set: true}
  - {op: json_field_eq, path: analiz.json, field: hatali_satir_sayisi, value: 4}

metadata:
  domain: data_analysis
  language: tr
  n_ref_steps: 2
  variant_of: tr-006-not-analizi
  notes: >
    tr-006'nin kirli veri varyanti: 4 satirda not alani bos, sayi disi veya
    yalnizca bosluk. Tek bir heredoc'la cozmek zorlasir cunku ilk naif
    int() denemesi patlar; model traceback'i okuyup veriye geri donmek
    zorunda kalir. Aykiri kume yine her iki ceyreklik yontemiyle ayni,
    cit payi alt+6 / ust-4. Max ve min tekil.
