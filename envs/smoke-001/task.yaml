id: smoke-001
split: single_step
image: verifiable-dataset/smoke-001:latest
workdir: /workspace
max_turns: 8

prompt: |
  Bir Linux terminalindesin ve calisma dizinin /workspace.

  Sunlari yap:
  1) /workspace altinda "cosmos" ve "yavuz" adinda iki klasor olustur.
  2) "cosmos" klasorunun icine "yavuz.txt" adinda bir dosya olustur ve
     iceriginde yalnizca yavuz123 yazsin.

  Isin bittiginde kisaca ne yaptigini ozetle.

# Referans cozum: gorevin gercekten cozulebilir oldugunu ve checker'in
# dogru calistigini modelsiz dogrulamak icin kullanilir.
reference_solution: |
  mkdir -p /workspace/cosmos /workspace/yavuz
  printf 'yavuz123' > /workspace/cosmos/yavuz.txt

# Referanstan farkli ama ayni derecede dogru cozumler. Turetilen check'ler
# bunlarin hepsinde de gecmeli: gecmiyorsa check'ler bicime takiliyor,
# yani gereginden siki demektir.
alt_solutions:
  - name: "echo ve install ile (sondaki newline farki)"
    script: |
      install -d /workspace/cosmos /workspace/yavuz
      echo yavuz123 > /workspace/cosmos/yavuz.txt
  - name: "dosyayi python ile yaz"
    script: |
      cd /workspace
      mkdir cosmos yavuz
      python3 -c "open('cosmos/yavuz.txt','w').write('yavuz123')"

metadata:
  domain: fs
  language: tr
  notes: >
    Ilk uctan uca duman testi. Checker trailing newline'a duyarsizdir:
    hem `echo yavuz123 >` hem `printf yavuz123 >` dogru kabul edilir.
