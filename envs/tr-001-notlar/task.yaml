id: tr-001-notlar
split: single_step
image: verifiable-dataset/base:latest
workdir: /workspace
max_turns: 8

prompt: |
  Bir Linux terminalindesin, çalışma dizinin /workspace.

  "notlar" adında bir klasör oluştur. Bu klasörün içine "yapilacaklar.txt"
  adında bir dosya oluştur ve içine her satırda bir tane olacak şekilde şu
  üç maddeyi yaz:

  sunum hazirla
  rapor gonder
  toplanti ayarla

  İşin bittiğinde kısaca ne yaptığını özetle.

# Susuz, kesin amac ifadesi. Prompt'un ham hali: creative writing asamasi
# bunu Turkce anlatiya cevirir, rakip cozum ise YALNIZCA bunu gorup gorevi
# sifirdan cozer -- iki bagimsiz uygulama ayni cevaba varmiyorsa amac
# yeterince kesin degil demektir.
goal_tr: >
  notlar dizini olustur ve icine her satirda bir madde olacak sekilde 'sunum
  hazirla', 'rapor gonder', 'toplanti ayarla' satirlarini iceren
  yapilacaklar.txt dosyasini yaz

reference_solution: |
  mkdir -p notlar
  printf 'sunum hazirla\nrapor gonder\ntoplanti ayarla\n' > notlar/yapilacaklar.txt

# Referanstan farkli ama ayni derecede dogru cozumler. Turetilen check'ler
# bunlarin hepsinde de gecmeli: gecmiyorsa check'ler bicime takiliyor,
# yani gereginden siki demektir.
alt_solutions:
  - name: "uc ayri echo ile ekleyerek"
    script: |
      mkdir notlar
      echo 'sunum hazirla' >> notlar/yapilacaklar.txt
      echo 'rapor gonder' >> notlar/yapilacaklar.txt
      echo 'toplanti ayarla' >> notlar/yapilacaklar.txt
  - name: "heredoc ile tek seferde"
    script: |
      install -d notlar
      cat > notlar/yapilacaklar.txt <<'EOT'
      sunum hazirla
      rapor gonder
      toplanti ayarla
      EOT

checks:
  - {op: is_dir, path: notlar}
  - {op: is_file, path: notlar/yapilacaklar.txt}
  - {op: file_line_count_eq, path: notlar/yapilacaklar.txt, value: 3}
  - {op: file_contains, path: notlar/yapilacaklar.txt, value: "sunum hazirla"}
  - {op: file_contains, path: notlar/yapilacaklar.txt, value: "rapor gonder"}
  - {op: file_contains, path: notlar/yapilacaklar.txt, value: "toplanti ayarla"}

metadata:
  domain: fs
  language: tr
  n_ref_steps: 2
